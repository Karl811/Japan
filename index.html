w4:{ai:4, warm:1, t:'Khởi động 30 giây', d:'Đúng hay sai? Ba câu nhanh', mins:1, steps:[
  {k:'tf', items:[
    {t:'Thời gian đi đường từ KTX đến xưởng được tính vào giờ làm.', a:false, why:'Thời gian đi đường không tính là giờ làm việc. Giờ làm tiêu chuẩn không quá 8 tiếng/ngày, 40 tiếng/tuần.'},
    {t:'Ngày phép năm có thể đổi thành tiền hoặc bán lại cho bạn.', a:false, why:'Không được quy đổi ngày phép thành lương, không được mua bán ngày phép.'},
    {t:'Bị trưởng ca nhắc vì làm sai quy trình nghĩa là mình đang bị bắt nạt.', a:false, why:'Nhắc nhở về công việc là để bạn tiến bộ: lắng nghe và sửa. Bắt nạt là chuyện khác, phần sau sẽ nói rõ.'}
  ]}
]},
a41:{ai:4, t:'Đọc phiếu lương', d:'Từ tổng thu nhập đến số tiền thực lĩnh', mins:7, steps:[
  {k:'explore', style:'payslip', intro:'Đây là phiếu lương mẫu của một TTS trên Tikme. Chạm vào từng dòng có dấu chấm để hiểu tiền của bạn đi đâu.',
    items:[
      {k:'kb', jp:'基本給', lbl:'Lương cơ bản', val:'170,000', why:'Lương theo hợp đồng, tính từ lương tối thiểu vùng nhân số giờ làm.'},
      {k:'zg', jp:'残業手当', lbl:'Phụ cấp tăng ca', val:'+30,000', why:'Làm quá 8 tiếng/ngày hoặc 40 tiếng/tuần được trả tăng ca, ít nhất 1,25 lần lương giờ.'},
      {k:'pc', jp:'諸手当', lbl:'Phụ cấp khác', val:'+10,000', sub:1},
      {k:'tg', jp:'総支給額', lbl:'Tổng thu nhập', val:'210,000', tot:1, sub:1},
      {k:'st', jp:'所得税', lbl:'Thuế thu nhập', val:'−6,500', why:'Công ty trừ tạm hằng tháng. Cuối năm quyết toán, có người phụ thuộc thì có thể được hoàn lại.'},
      {k:'jm', jp:'住民税', lbl:'Thuế cư trú', val:'−8,500', why:'Tính trên thu nhập năm trước, nên năm đầu thường chưa phải đóng. Từ năm thứ 2 lương thực lĩnh sẽ giảm, hãy chuẩn bị trước.'},
      {k:'kk', jp:'健康保険', lbl:'Bảo hiểm y tế', val:'−10,500', why:'Nhờ khoản này, khi khám chữa bệnh bạn chỉ trả 30% chi phí.'},
      {k:'nk', jp:'厚生年金', lbl:'Bảo hiểm hưu trí (Nenkin)', val:'−18,900', why:'Khoản lớn nhất nhưng không mất: khi về nước được làm thủ tục nhận lại một phần (tính tối đa 5 năm đóng), nộp đơn trong 2 năm sau khi rời Nhật.'},
      {k:'ky', jp:'雇用保険', lbl:'Bảo hiểm thất nghiệp', val:'−1,260', sub:1},
      {k:'ry', jp:'寮費', lbl:'Tiền nhà (KTX)', val:'−20,000', why:'Tiền KTX trừ thẳng vào lương. Điện, nước, gas thường bạn tự trả thêm.'},
      {k:'td', jp:'手取り', lbl:'Thực lĩnh', val:'≈144,340', tot:1, sub:1}
    ],
    done:'Từ 210.000 yên tổng thu nhập, bạn thực lĩnh khoảng 144.340 yên. Biết trước để không bất ngờ, và không nghe lời rủ "việc thêm" vì tưởng mình bị trừ oan.',
    src:'Tikme, mục "Bảng lương mẫu TTS tại Nhật" (số liệu tham khảo theo lương tối thiểu 2025) · '+SRC_BG+', slide 38 và 40'},
  {k:'tikme', url:'https://tikme.com/kien-thuc/thue-bao-hiem', title:'Pháp luật & Bảo hiểm tại Nhật: Nắm vững kiến thức, làm chủ cuộc sống', cat:'Tikme · Quy định & Bảo hiểm', mins:8,
    intro:'Đọc mục "Thuế & Bảo hiểm" và "Những điều tuyệt đối KHÔNG được làm", rồi quay lại trả lời 3 câu hỏi.',
    qs:[
      {t:'Trong các khoản bị trừ, khoản nào năm đầu thường chưa phải đóng?', o:['Bảo hiểm y tế','Thuế cư trú (住民税)','Bảo hiểm hưu trí'], a:1, why:'Thuế cư trú tính trên thu nhập năm trước nên thường bắt đầu trừ từ năm thứ 2.'},
      {t:'Theo bài viết, khi bị công ty đối xử không tốt hoặc nợ lương, sai lầm phổ biến là gì?', o:['Báo OTIT hoặc Hiệp hội','Bỏ trốn vì nghĩ mình không có quyền phản kháng','Ghi chép lại sự việc'], a:1, why:'Bỏ trốn làm bạn mất tư cách lưu trú, mất cả sự bảo vệ của pháp luật. Đường đúng là báo đúng kênh.'},
      {t:'Làm "phục vụ quán nhậu" ban đêm có tiếp viên, dù chỉ rửa bát, thì sao?', o:['Được, vì chỉ rửa bát','Được nếu làm ngày nghỉ','Vi phạm nghiêm trọng, có thể bị trục xuất'], a:2, why:'Người có tư cách TTS tuyệt đối không làm việc ở nơi thuộc diện giải trí người lớn, kể cả việc phụ.'}
    ],
    after:'Phiếu lương là của bạn. Giữ lại từng tháng để đối chiếu, làm quyết toán thuế và thủ tục nhận lại Nenkin khi về nước.',
    src:'Tikme, chuyên mục "Quy định & Bảo hiểm"'}
]},
a42:{ai:4, t:'Ba ngã rẽ ở xưởng', d:'Trung thực với công ty, lên tiếng khi bị xâm phạm', mins:7, steps:[
  {k:'branch', title:'Ngã rẽ 1 · Năm phút giờ nghỉ', foe:'yeu',
    ctx:'Giờ nghỉ trưa, ai ra khỏi xưởng phải chấm công. Bạn đang buồn ngủ, nghĩ: nếu đi vòng qua chỗ hâm đồ ăn rồi mới chấm công, mình sẽ có thêm vài phút.',
    whisper:'Có năm phút thôi, ai mà để ý. Chắc không sao.',
    flags:['Chấm công là lời hứa về thời gian của bạn với công ty','Đồng nghiệp người Nhật để ý rất kỹ','Lòng tin mất rồi rất khó lấy lại'],
    opts:[
      {t:'Chấm công đúng giờ, tranh thủ ngủ trưa trong giờ nghỉ.', ok:1, out:{t:'Giờ nào việc nấy', p:'Bạn nghỉ đủ, vào ca đúng giờ với đồ bảo hộ chỉnh tề. Đồng nghiệp tin bạn, công ty dễ giao việc mới cho bạn.'}},
      {t:'Đi vòng một lần thôi, mai không làm nữa.', ok:0, out:{t:'Một lần thành nhiều lần', p:'Một bạn TTS từng làm đúng như vậy, bị nhắc nhở rồi vẫn tái phạm. Đồng nghiệp bức xúc báo lên công ty, bạn phải viết cam kết không tái phạm.', r:1}},
      {t:'Lấy thêm một gói đồ ăn của công ty bù cho mệt.', ok:0, out:{t:'Từ ăn gian đến mất việc', p:'Một bạn đã lên Kỹ năng đặc định lấy hai gói đồ ăn nhưng chỉ trả tiền gói rẻ. Camera ghi lại, công ty cho bạn tự kết thúc hợp đồng. Sau đó công ty lắp thêm camera, cả nhóm bị giảm lòng tin.', r:2}}
    ],
    law:{t:'Trung thực trong việc nhỏ giữ được việc lớn.', p:[
      'Giờ nghỉ trưa thường 45 đến 60 phút, đủ để ăn và nghỉ. Ngoài giờ đó là giờ làm.',
      'Lấy đồ của công ty, của đồng nghiệp khi chưa được phép là trộm cắp, dù món nhỏ.',
      'Bị sa thải vì hành vi sai trái thì TTS tự trả tiền vé về nước.'],
      src:'Casestudy TTS Esuhai 2026, mục "TTS ăn gian đồ ăn và thời gian chấm công" · '+SRC_BG+', slide 26, 34 và 38'},
    fix:'Lỡ làm rồi: chủ động xin lỗi người hướng dẫn, nói rõ và hứa không tái phạm. Tự nhận còn hơn để camera nói thay.'},
  {k:'branch', title:'Ngã rẽ 2 · Câu nói của Senpai', foe:'yeu',
    ctx:'Mấy tuần nay, một Senpai trong tổ ngày nào cũng nói trước mặt mọi người: "Chậm thế. Không cho tăng ca nữa. Về nước đi." Bạn thấy rất nặng nề.',
    whisper:'Cứ chịu đựng đi, nói ra lại mất việc. Chắc rồi sẽ qua.',
    flags:['Lời nói lặp lại, dọa cắt tăng ca, đuổi về nước','Khác với nhắc nhở về cách làm việc','Có người được giao việc lắng nghe bạn'],
    opts:[
      {t:'Im lặng chịu đựng, cố làm nhanh hơn.', ok:0, out:{t:'Một năm rưỡi im lặng', p:'Một bạn TTS đã chịu đựng như vậy suốt một năm rưỡi, đến khi không chịu nổi thì đòi chuyển vị trí hoặc về nước. Lúc đó mọi chuyện đã khó gỡ hơn rất nhiều.', r:2}},
      {t:'Đăng bài lên Facebook kể tội công ty cho mọi người biết.', ok:0, out:{t:'Chuyện riêng thành chuyện lớn', p:'Bài đăng lan đi, công ty và Hiệp hội biết qua mạng thay vì nghe bạn nói. Chuyện chưa được giải quyết mà bạn còn bị đánh giá thiếu chuyên nghiệp.', r:1}},
      {t:'Ghi lại ngày giờ, lời nói; báo người hướng dẫn, Hiệp hội hoặc Esuhai.', ok:1, out:{t:'Nói ra đúng người, đúng lúc', p:'Hiệp hội và công ty vào cuộc, xác nhận lời nói đó là không phù hợp và nói chuyện với Senpai. Bạn được lắng nghe, công việc ổn định lại.'}}
    ],
    law:{t:'Không im lặng chịu bị bắt nạt.', p:[
      'Lời nói đe dọa, hạ nhục lặp đi lặp lại như "không cho tăng ca, về nước đi" là lúc Hiệp hội và công ty cần vào cuộc.',
      'Bị nhắc vì làm sai thì lắng nghe và sửa. Bị bắt nạt thì báo cáo sớm, kèm ghi chép cụ thể.',
      'Thấy bạn mình bị bắt nạt, đừng nói "em không làm cùng nên không rõ". Hãy cùng bạn đi báo.'],
      src:'Casestudy TTS Esuhai 2026, mục "TTS chọn im lặng khi bị bắt nạt tại nơi làm việc" · '+SRC_SOTAY+', mục 14'},
    fix:'Nếu đã chịu đựng lâu rồi: vẫn chưa muộn. Kể với anh chị Esuhai bằng tiếng Việt, mang theo những gì bạn đã ghi lại.'},
  {k:'branch', title:'Ngã rẽ 3 · Giữ hộ hộ chiếu', foe:'yeu',
    ctx:'Một buổi sáng, quản lý thu hộ chiếu và thẻ cư trú của cả nhóm TTS, nói là "giữ hộ cho khỏi mất".',
    whisper:'Công ty giữ hộ thì càng an toàn. Chắc không sao.',
    flags:['Thẻ cư trú phải luôn mang theo người','Giữ hộ chiếu, thẻ cư trú của TTS là vi phạm','Có kênh báo cáo, không cần làm căng'],
    opts:[
      {t:'Cả nhóm tự ý nghỉ làm để phản đối.', ok:0, out:{t:'Đúng ý, sai cách', p:'Nghỉ làm không báo là vi phạm nội quy, chuyện giấy tờ chưa được giải quyết mà cả nhóm còn bị lập biên bản.', r:1}},
      {t:'Lễ phép xin giữ lại thẻ cư trú; nếu không được, báo Hiệp hội hoặc OTIT.', ok:1, out:{t:'Giấy tờ về đúng chủ', p:'Hiệp hội trao đổi với công ty, hộ chiếu và thẻ cư trú được trả lại cho từng người. Bạn không bị đối xử bất lợi vì đã báo cáo.'}},
      {t:'Đưa luôn, công ty bảo gì thì làm nấy.', ok:0, out:{t:'Giấy tờ không còn trong tay bạn', p:'Khi cần đi khám bệnh, bị cảnh sát hỏi giấy tờ hay muốn đổi chỗ thực tập, bạn không có gì trong tay. Giữ giấy tờ của TTS là dấu hiệu nơi làm việc có vấn đề.', r:0}}
    ],
    law:{t:'Hộ chiếu và thẻ cư trú phải ở trong tay bạn.', p:[
      'Lấy hộ chiếu, thẻ cư trú của TTS với lý do giữ hộ là vi phạm Luật thực tập kỹ năng.',
      'TTS được quyền tố cáo vi phạm lên cơ quan chức năng. Công ty, Hiệp hội không được dừng thực tập hay đối xử bất lợi vì việc tố cáo.',
      'Các vi phạm khác cũng cần báo: không trả lương đúng hợp đồng, không trả tăng ca, bắt bấm thẻ ra về rồi làm tiếp, hạn chế đi lại.'],
      src:SRC_SOTAY+', mục 14 (Điều 49 Luật thực tập kỹ năng) · '+SRC_BG+', slide 48'},
    fix:'Lỡ đã nộp rồi: lễ phép xin lại thẻ cư trú để mang theo người, rồi gọi Hiệp hội, Esuhai hoặc đường dây tiếng Việt của OTIT 0120-250-168.'}
]},
a43:{ai:4, t:'Phải trái phân minh', d:'Lỗi của mình, vi phạm của công ty, hay chuyện bình thường?', mins:5, steps:[
  {k:'classify', intro:'Trước khi báo cáo, hãy tự hỏi: đây là lỗi của mình, vi phạm của công ty, hay chuyện bình thường ở Nhật? Chạm vào nhóm đúng.',
    cats:['Mình cần sửa','Công ty vi phạm: báo cáo','Bình thường ở Nhật'],
    items:[
      {t:'Bị nhắc nhiều lần vì đến muộn 5 phút.', a:0, why:'Đúng giờ là tác phong cơ bản. Lắng nghe và sửa.', src:''},
      {t:'Làm thêm giờ nhưng phiếu lương không tính tiền tăng ca.', a:1, why:'Không trả tăng ca là vi phạm Luật tiêu chuẩn lao động.', src:SRC_BG+', slide 48'},
      {t:'Sau một năm, công ty chuyển bạn sang công đoạn khác.', a:2, why:'Công ty thuyên chuyển để bạn học thêm kỹ năng và hỗ trợ Kohai sau này. Hãy hợp tác.', src:'Casestudy TTS Esuhai 2026'},
      {t:'Trêu đồng nghiệp nữ người Nhật chuyện yêu đương dù chị ấy không vui.', a:0, why:'Đây là quấy rối. Đã có đồng nghiệp phải nghỉ một tuần vì hoảng loạn.', src:'Casestudy TTS Esuhai 2026'},
      {t:'Bị yêu cầu bấm thẻ ra về trước rồi quay lại làm tiếp.', a:1, why:'Đây là cách giấu giờ tăng ca, vi phạm luật lao động.', src:SRC_BG+', slide 48'},
      {t:'Mùa cao điểm, công việc thời vụ có ngày làm hơn 8 tiếng theo lịch đã thông báo.', a:2, why:'Với công việc thời vụ, luật cho phép công ty điều chỉnh giờ làm vào mùa cao điểm.', src:SRC_BG+', slide 39'},
      {t:'Làm hỏng dụng cụ vì không làm theo hướng dẫn.', a:0, why:'Làm hỏng đồ của công ty có thể phải bồi thường. Không hiểu thì hỏi người chỉ đạo đến khi hiểu.', src:SRC_BG+', slide 26'}
    ]},
  {k:'say', who:'tan', mood:'', src:'Casestudy TTS Esuhai 2026 · '+SRC_BG+', slide 49',
    text:'Có chuyện ở xưởng, cháu hỏi người hướng dẫn trước để chắc mình không hiểu nhầm. Còn chuyện đổi chỗ làm: TTS chỉ chuyển nơi thực tập khi công ty khó khăn hoặc có lý do bất khả kháng, qua Hiệp hội. Với Ikusei Shuro, được chuyển việc theo nguyện vọng khi đã làm ít nhất 1 năm ở nơi đầu tiên, đậu kỳ thi kỹ năng và đạt trình độ tiếng Nhật theo quy định (khoảng A2). Chuyển việc chỉ có lợi khi cháu có định hướng rõ, không phải cứ đổi là lương cao hơn.'},
  {k:'write', intro:'Viết lá bùa cho những ngày ở xưởng.',
    fields:[{key:'xuong', label:'Khi gặp chuyện ở xưởng mà chưa rõ lỗi của ai, tôi sẽ…', ph:'Ví dụ: …ghi lại sự việc, hỏi người hướng dẫn trước, nếu là vi phạm thì báo Hiệp hội hoặc Esuhai.', req:1, min:5}],
    opt:{key:'bannat', label:'Nếu thấy một bạn cùng nhóm bị bắt nạt, bạn sẽ làm gì?', ph:'Ví dụ: Mình sẽ hỏi chuyện bạn, đi cùng bạn đến gặp người hướng dẫn, không nói "mình không biết".'}}
]},

/* ===== ẢI 5 · PHỐ PHƯỜNG ===== */
w5:{ai:5, warm:1, t:'Khởi động 30 giây', d:'Đúng hay sai? Ba câu nhanh', mins:1, steps:[
  {k:'tf', items:[
    {t:'Xe đạp bị vứt ở điểm rác thì được mang về dùng.', a:false, why:'Dù xe bị bỏ đi, mang về vẫn bị xem là trộm cắp. Đồ ở điểm rác cũng không được lấy.'},
    {t:'Từ 4/2026, vừa đạp xe vừa dùng điện thoại có thể bị phạt 12.000 yên.', a:true, why:'Từ 1/4/2026, xe đạp áp dụng "vé xanh" với người từ 16 tuổi.'},
    {t:'Xe có tay ga, không cần đạp vẫn chạy thì không cần bằng lái.', a:false, why:'Xe tự chạy bằng ga thường được xếp là xe gắn máy: cần bằng lái, biển số, bảo hiểm.'}
  ]}
]},
a51:{ai:5, t:'Bản đồ phố', d:'Sáu góc phố, sáu lựa chọn', mins:6, steps:[
  {k:'street', intro:'Chạm vào từng điểm trên bản đồ. Mỗi điểm là một tình huống phỏng theo chuyện có thật.',
    spots:[
      {k:'ga', name:'Ga tàu', jp:'駅', x:16, y:30,
        q:'Đi chơi xa, vé tàu đắt. Bạn cùng nhóm rủ đi sát sau người khác để qua cửa soát vé.',
        o:['Đi theo, một lần thôi mà','Mua vé hoặc nạp đủ tiền vào thẻ IC','Mua vé chặng ngắn nhất rồi đi xa hơn'], a:1,
        why:'Trốn vé hay mua vé thiếu đều là gian lận, bị thu tiền phạt nhiều lần giá vé và có thể bị xử lý. Chuyện trốn vé từng khiến người Nhật có định kiến với người Việt.',
        src:'Casestudy TTS Esuhai, mục về trốn vé tàu xe'},
      {k:'st', name:'Siêu thị', jp:'スーパー', x:44, y:27,
        q:'Hộp kem dưỡng da 800 yên, quầy đang đông. Yêu thì thầm: "Cho vào túi, ai mà biết."',
        o:['Cho vào túi, lỡ bị hỏi thì nói quên','Bóc ra dùng thử rồi đặt lại kệ','Không lấy. Muốn mua thì xếp hàng trả tiền'], a:2,
        why:'Một bạn TTS từng lấy hộp kem ở siêu thị, hai hôm sau cảnh sát đến vì camera ghi lại. Bạn còn bao biện "em lỡ" nên càng bị đánh giá nặng. Trộm cắp thì bị sa thải và tự trả vé về nước.',
        src:'Casestudy TTS Esuhai 2025 · '+SRC_BG+', slide 34'},
      {k:'vu', name:'Ruộng khoai', jp:'畑', x:76, y:24,
        q:'Ruộng khoai bên đường vừa thu hoạch, còn sót nhiều củ. Bạn cùng phòng rủ nhặt về nấu.',
        o:['Nhặt thôi, ruộng thu hoạch xong rồi','Không nhặt; muốn thì hỏi xin chủ ruộng','Nhặt ít thôi, vài củ không sao'], a:1,
        why:'Hai bạn nữ TTS từng bị bắt vì lấy 25 củ khoai trong vườn. Trong tiếng Nhật, "hái trộm" và "ăn cắp" là cùng một chữ: 盗む.',
        src:'Casestudy TTS Esuhai · '+SRC_BG+', slide 10'},
      {k:'bien', name:'Bãi biển', jp:'浜', x:60, y:86,
        q:'Bãi biển có nhiều sò, nhiều người đang cào. Bạn cũng muốn bắt một ít.',
        o:['Tìm biển báo, hỏi người địa phương; không chắc thì không bắt','Cào luôn vì nhiều người cũng cào','Cào một ít ăn tại chỗ'], a:0,
        why:'Ba bạn TTS ở Aichi từng bị cơ quan quản lý giữ vì bắt sò, công ty phải đến bảo lãnh. Nơi đó có biển cấm nhưng các bạn không để ý, lại thấy nhiều người bắt. Nhiều vùng biển có quyền đánh bắt riêng.',
        src:'Casestudy TTS Esuhai, mục "Hái trái và bắt sò điệp trái phép"'},
      {k:'de', name:'Đê chắn sóng', jp:'防波堤', x:82, y:76,
        q:'Đầu đê có biển "Cấm vào", nhưng cuối đê câu được cá to. Tuần trước nhóm bạn vào câu vẫn không sao.',
        o:['Vào câu, tuần trước có sao đâu','Vào nhưng mặc áo phao cho chắc','Câu ở khu vực được phép'], a:2,
        why:'Năm 2026, một bạn TTS đi câu ở khu vực cấm bị sóng cuốn và may mắn sống sót. Khu vực bị cấm nghĩa là đã từng có tai nạn. Vào nơi cấm là phạm luật, và có thể mất mạng.',
        src:'Casestudy TTS Esuhai 2026 · '+SRC_BG+', slide 17'},
      {k:'cv', name:'Công viên', jp:'公園', x:30, y:68,
        q:'Một bé gái khoảng 5 tuổi đứng khóc một mình. Trong túi bạn có kẹo.',
        o:['Cho kẹo và dắt bé đi tìm bố mẹ','Đứng gần trông chừng, báo nhân viên hoặc đồn Kōban, không chạm vào bé','Chụp ảnh bé đăng nhóm hỏi ai biết'], a:1,
        why:'Ở Nhật, người lạ cho kẹo, dắt trẻ đi có thể bị xem là đáng ngờ, dù bạn có ý tốt. Cách đúng là báo người có trách nhiệm hoặc cảnh sát. Đăng ảnh trẻ em lên mạng cũng không được.',
        src:SRC_BG+', slide 21'}
    ]}
]},
a52:{ai:5, t:'Hai bánh xe', d:'Xe đạp ở Nhật: tiện, nhưng có luật', mins:6, steps:[
  {k:'branch', title:'Chiếc "xe đạp điện" của anh họ', foe:'yeu',
    ctx:'Anh họ ở tỉnh bên sắp về nước, bán lại chiếc "xe đạp điện" giá 2 man. Xe có tay ga, không cần đạp vẫn chạy được 30 km/h.',
    from:'Anh họ', sub:'Sắp về nước',
    msgs:['Xe đạp điện thôi em, ở đây ai cũng đi, không cần bằng đâu.'],
    whisper:'Anh họ ở Nhật lâu rồi, chắc không sao.',
    flags:['Xe tự chạy bằng ga, không cần đạp','"Ai cũng đi" không phải là căn cứ','Hỏi Hiệp hội trước khi mua mất có một tin nhắn'],
    opts:[
      {t:'Mua, nhưng chỉ đi đường làng cho vắng.', ok:0, out:{t:'Đường vắng vẫn là đường', p:'Cảnh sát tuần tra dừng xe. Đường vắng hay đông thì xe máy không bằng lái vẫn là vi phạm.', r:3}},
      {t:'Mua luôn, rẻ mà tiện.', ok:0, out:{t:'Hơn một tháng lên đồn', p:'Năm 2026, một bạn TTS đi loại xe này bị cảnh sát dừng. Bạn bị gọi lên đồn lấy lời khai suốt hơn một tháng, công ty đình chỉ làm việc 5 ngày. Bao nhiêu uy tín gây dựng trước đó gần như mất hết.', r:3}},
      {t:'Hỏi người hướng dẫn hoặc Hiệp hội trước khi mua.', ok:1, out:{t:'Một tin nhắn, tránh cả tháng rắc rối', p:'Người hướng dẫn giải thích: xe đạp trợ lực phải đạp mới chạy thì không cần bằng; xe tự chạy bằng ga là xe máy. Bạn không mua chiếc xe đó.'}}
    ],
    law:{t:'Xe trợ lực và xe có ga: nhìn giống nhau, luật khác nhau.', p:[
      'Xe đạp trợ lực điện: phải đạp mới chạy, mô tơ chỉ hỗ trợ. Không cần bằng lái.',
      'Xe tự chạy bằng ga, kể cả loại có bàn đạp, thường được xếp là xe gắn máy: cần bằng lái, biển số, bảo hiểm bắt buộc, mũ bảo hiểm.',
      'TTS không được lái xe máy, ô tô khi chưa có bằng lái Nhật. Bằng lái Việt Nam không dùng trực tiếp ở Nhật được.'],
      src:'Casestudy TTS Esuhai 2026, mục "Vấn đề tham gia giao thông và sử dụng xe đạp" · '+SRC_BG+', slide 11 và 23 · Tikme, mục "Lái xe không bằng lái Nhật"'},
    fix:'Lỡ mua rồi: đừng đi, cất xe lại và hỏi ngay người hướng dẫn hoặc Hiệp hội cách xử lý.'},
  {k:'swipe', labels:{trap:'Không nên', safe:'Nên'}, intro:'Luật hai bánh. Chọn "Nên" hoặc "Không nên". Mức phạt là "vé xanh" áp dụng từ 1/4/2026 cho người từ 16 tuổi.',
    cards:[
      {t:'Vừa đạp xe vừa nhắn tin.', a:'trap', why:'Vé xanh 12.000 yên. Gây nguy hiểm còn có thể bị xử lý nặng hơn.'},
      {t:'Đeo tai nghe nghe nhạc khi đạp xe.', a:'trap', why:'Vé xanh 5.000 yên. Bạn không nghe được còi xe và tiếng người xung quanh.'},
      {t:'Chở bạn ngồi phía sau.', a:'trap', why:'Vé xanh 3.000 yên. Xe đạp ở Nhật chỉ dành cho một người.'},
      {t:'Đi trên vỉa hè cho an toàn.', a:'trap', why:'Về nguyên tắc, xe đạp đi dưới lòng đường, phía bên trái. Chỉ đi vỉa hè khi có biển cho phép và phải nhường người đi bộ.'},
      {t:'Đội mũ bảo hiểm khi đi xe đạp.', a:'safe', why:'Luật Nhật yêu cầu người đi xe đạp cố gắng đội mũ bảo hiểm. Nhiều công ty bắt buộc và phát mũ sẵn.'},
      {t:'Đăng ký chống trộm (防犯登録) khi mua hoặc được cho xe.', a:'safe', why:'Đi xe chưa đăng ký tên mình, cảnh sát kiểm tra sẽ nghi là xe trộm. Đăng ký ở cửa hàng khoảng 500 yên.'},
      {t:'Mua bảo hiểm xe đạp.', a:'safe', why:'Nhiều địa phương bắt buộc. Gây tai nạn có thể phải bồi thường số tiền rất lớn.'},
      {t:'Mất xe nhưng không báo, mượn tạm xe bạn đi.', a:'trap', why:'Mất xe phải báo cảnh sát ngay. Có bạn im lặng cho qua, đến khi cảnh sát đối chiếu mới phát hiện, rắc rối hơn nhiều.'}
    ], src:'Luật Giao thông đường bộ Nhật Bản (vé xanh cho xe đạp từ 1/4/2026) · Tikme, mục "Đi xe đạp không đăng ký" · Casestudy TTS Esuhai 2026'},
  {k:'say', who:'tan', mood:'', src:'Casestudy TTS Esuhai 2026',
    text:'Xe đạp ở Nhật đều có số khung, đăng ký theo tên người dùng. Năm 2026, một chiếc xe đứng tên Hiệp hội bị người khác dùng để trộm đồ trong siêu thị, vì nhóm TTS hay đổi xe cho nhau mà không báo. Nhớ nhé cháu: mất xe thì báo cảnh sát ngay; cho, bán hay đổi xe thì báo Hiệp hội.'}
]},
a53:{ai:5, t:'Phép lịch sự nơi công cộng', d:'Bốn từ tiếng Nhật bạn sẽ gặp trên áp phích', mins:5, steps:[
  {k:'classify', intro:'Mỗi hành vi dưới đây thuộc loại nào? Đây là những từ bạn sẽ gặp trên áp phích ở ga tàu và nơi làm việc.',
    cats:['迷惑行為 · Gây phiền nhiễu','ストーカー · Đeo bám','痴漢 · Sàm sỡ','セクハラ · Quấy rối nơi làm việc'],
    items:[
      {t:'Gọi điện, cười đùa ồn ào trên tàu điện.', a:0, why:'Làm phiền người khác nơi công cộng.'},
      {t:'Thích một chị đồng nghiệp, ngày nào cũng chờ ở cổng, nhắn tin liên tục dù chị không trả lời.', a:1, why:'Theo dõi, chờ đợi, liên lạc liên tục khi người kia không muốn là hành vi đeo bám, có thể bị xử lý theo luật.'},
      {t:'Lợi dụng tàu đông để chạm vào người lạ.', a:2, why:'Chạm vào cơ thể người khác trái ý muốn là tội phạm ở Nhật.'},
      {t:'Ở xưởng, trêu chọc đồng nghiệp nữ chuyện yêu đương dù chị ấy khó chịu.', a:3, why:'Lời nói, yêu cầu mang tính tình dục ở nơi làm việc là quấy rối, dù mình nghĩ chỉ là đùa.'},
      {t:'Chụp lén người khác bằng điện thoại.', a:0, why:'Quay lén là hành vi bị cấm, có thể bị xử lý hình sự.'}
    ]},
  {k:'say', who:'tan', mood:'serious', src:'Casestudy TTS Esuhai 2026 · '+SRC_BG+', slide 21',
    text:'Ở Nhật, thước đo không phải là "mình chỉ đùa", mà là người kia cảm thấy thế nào. Có bạn TTS trêu một đồng nghiệp nữ lớn tuổi đến mức chị ấy hoảng loạn phải nghỉ một tuần, các Kohai còn cười theo. Cả nhóm bị nhắc nhở, riêng bạn ấy tái phạm và phải về nước. Ở nhà cũng vậy: mặc áo đàng hoàng, đừng cởi trần ngoài ban công; muốn làm quen thì đừng xin số điện thoại người lạ.'},
  {k:'write', intro:'Lá bùa cho những lúc vui quá trớn.',
    fields:[{key:'pho', label:'Khi thấy bạn mình đùa quá trớn với người khác, tôi sẽ…', ph:'Ví dụ: …không cười theo, kéo bạn ra và nhắc nhẹ "người ta không vui đâu".', req:1, min:5}],
    opt:{key:'pho2', label:'Ở phố Nhật, điều gì khiến bạn thấy khác Việt Nam nhất, và bạn sẽ thay đổi thói quen nào?', ph:'Ví dụ: Ở Việt Nam mình hay đi xe trên vỉa hè. Sang Nhật mình sẽ đi dưới lòng đường bên trái và không đeo tai nghe.'}}
]},

/* ===== ẢI 7 · SÒNG ĐỎ ĐEN ===== */
w7:{ai:7, warm:1, t:'Khởi động 30 giây', d:'Đúng hay sai? Ba câu nhanh', mins:1, steps:[
  {k:'tf', items:[
    {t:'Đánh bài ăn tiền với bạn bè qua mạng thì không sao, vì không ở sòng bạc.', a:false, why:'Ở Nhật, đánh bạc ăn tiền là phạm luật, dù qua mạng hay giữa bạn bè, trừ các hình thức Nhà nước cho phép.'},
    {t:'Hiệp hội có thể cấm TTS cho vay mượn tiền và chơi hụi.', a:true, why:'Đây là quy định thường gặp ở các Hiệp hội, để TTS không vướng vào nợ nần, mâu thuẫn.'},
    {t:'Vay nóng để trả nợ cũ là cách nhanh nhất để thoát nợ.', a:false, why:'Vay nóng chồng thêm lãi lên nợ cũ. Đó là cách nhanh nhất để nợ không bao giờ hết.'}
  ]}
]},
a71:{ai:7, t:'Phòng chiếu Kōban', d:'Xem phim của Cảnh sát Tokyo, dừng lại và chọn', mins:22, steps:[
  {k:'video', vid:'ppPxUuyRwSo', title:'Downward Spiral · Vòng xoáy đi xuống',
    intro:'Chú mời cháu xem bộ phim Cảnh sát Thủ đô Tokyo làm cho người nước ngoài. Phim nói tiếng Nhật, có phụ đề tiếng Việt. Xem từng đoạn, rồi chọn xem nhân vật nên làm gì.',
    who:'Minh là du học sinh muốn thành kỹ sư. Dũng là thực tập sinh, bạn cùng quê. Thảo là bạn cùng lớp của Minh.',
    segs:[
      {s:0, e:216, lbl:'Đoạn 1 · Người bạn cùng quê',
        q:'Dũng nói đã bỏ khỏi nơi thực tập, visa hết hạn, xin ở chung với Minh và chia tiền nhà. Minh nên làm gì?',
        o:['Cho ở chung, giúp đồng hương lúc khó khăn','Cho ở tạm vài hôm rồi tính','Không cho ở chung; khuyên Dũng liên hệ cơ quan chức năng, và kể với thầy cô'], a:2,
        why:'Trong phim, Minh đồng ý vì thấy Dũng đáng thương. Cho người cư trú bất hợp pháp ở cùng, che giấu họ, cũng là vi phạm Luật Quản lý xuất nhập cảnh. Với TTS, KTX còn không được cho người ngoài vào ở.'},
      {s:216, e:408, lbl:'Đoạn 2 · Thẻ cư trú giả và ván bài',
        q:'Dũng khoe đồ đắt tiền, rủ Minh chơi bài cá cược với nhóm tìm được qua mạng xã hội. Minh nên làm gì?',
        o:['Không chơi, dù chỉ một ván','Chơi thử một ván cho biết','Chỉ ngồi xem, không đặt tiền'], a:0,
        why:'Đánh bạc ăn tiền là phạm luật ở Nhật. Còn thẻ cư trú giả của Dũng bị phát hiện ngay khi nhà tuyển dụng kiểm tra bằng ứng dụng: giấy tờ giả không qua được.'},
      {s:408, e:497, lbl:'Đoạn 3 · Món nợ 50 man',
        q:'Hai người nợ 50 man, bị dọa sẽ bắt bố mẹ trả. Dũng nói có "việc làm thêm kiếm được tiền". Minh nên làm gì?',
        o:['Nghe thử xem là việc gì đã','Vay nóng chỗ khác để trả cho xong','Báo cảnh sát về việc bị đe dọa, kể với thầy cô'], a:2,
        why:'Bị đe dọa đòi nợ là lúc phải gọi cảnh sát. "Việc làm thêm" xuất hiện đúng lúc bạn cùng đường gần như luôn là bẫy. Vay nóng để trả chỉ làm nợ dày thêm.'},
      {s:497, e:548, lbl:'Đoạn 4 · "Bán tài khoản đi"',
        q:'Dũng bảo Minh bán tài khoản ngân hàng vì Minh còn visa hợp lệ, mở được nhiều tài khoản. Minh nghĩ "bán tài khoản là tội phạm" nhưng chỉ nói "để em suy nghĩ". Bạn sẽ nói gì?',
        o:['Từ chối dứt khoát, không bàn thêm','"Để em suy nghĩ" là đủ lịch sự rồi','Bán một tài khoản ít dùng thôi'], a:0,
        why:'Bán, cho mượn tài khoản ngân hàng là phạm luật. Câu "để em suy nghĩ" để ngỏ cửa cho lần rủ sau. Với cái sai đã biết rõ, từ chối ngay mới là tự bảo vệ mình.'},
      {s:548, e:658, lbl:'Đoạn 5 · Lời của Thảo',
        q:'Thảo phát hiện Minh làm thêm quá giờ và gặp chuyện nguy hiểm. Thảo nói sẽ đi cùng Minh đến gặp thầy cô hoặc cảnh sát. Nếu bạn là Minh?',
        o:['"Kệ tớ, không liên quan đến cậu"','Hứa để mai tính','Nhận lời, đi cùng Thảo ngay'], a:2,
        why:'Trong phim, Minh gạt Thảo đi. Người dám can ngăn mình mới là bạn thật. Du học sinh chỉ được làm thêm tối đa 28 giờ/tuần; TTS thì không được làm thêm chỗ nào khác.'},
      {s:658, e:990, lbl:'Đoạn 6 · Kết cục và "Giá như…"', q:''}
    ],
    src:'Video "Downward Spiral" (Phụ đề tiếng Việt), kênh chính thức Cảnh sát Thủ đô Tokyo (警視庁), 2023'}
]},
a72:{ai:7, t:'Vòng xoáy', d:'Mỗi lần gật đầu là một nấc trượt', mins:5, steps:[
  {k:'order', intro:'Sắp xếp các bước trượt của Minh và Dũng theo đúng thứ tự trong phim.',
    items:['Dũng bỏ nơi thực tập, ở quá hạn visa','Cho người cư trú bất hợp pháp ở chung','Dùng thẻ cư trú giả đi xin việc','Chơi bài ăn tiền qua mạng xã hội','Nợ 50 man, bị dọa bắt bố mẹ trả','Bán tài khoản ngân hàng, đi nhận "tiền bẩn"'],
    done:'Không bước nào trông như tội ác lớn. Mỗi lần chỉ là một cái gật đầu nhỏ. Chính vì vậy nó mới là vòng xoáy.',
    src:'Video "Downward Spiral", Cảnh sát Thủ đô Tokyo'},
  {k:'law', law:{t:'Những tội danh nằm trong một bộ phim 16 phút.', p:[
      'Ở quá hạn visa và che giấu người cư trú bất hợp pháp: vi phạm Luật Quản lý xuất nhập cảnh.',
      'Đánh bạc ăn tiền: phạm tội đánh bạc. Dùng thẻ cư trú giả: tội nặng, bị trục xuất.',
      'Bán tài khoản, đi nhận tiền của người bị lừa: đồng phạm lừa đảo, dù chỉ "đi lấy hộ một gói đồ".'],
      src:'Video "Downward Spiral", Cảnh sát Thủ đô Tokyo · '+SRC_SOTAY+', mục 6 và 9 · Luật Quản lý xuất nhập cảnh Nhật Bản'}},
  {k:'write', intro:'Phim kết thúc bằng những câu "giá như lúc đó…". Đến lượt bạn.',
    fields:[{key:'gianhu', label:'Giá như lúc đó Minh…', ph:'Ví dụ: …nghe lời Thảo, đi cùng bạn đến gặp thầy cô ngay hôm đó.', req:1, min:5}],
    opt:{key:'gianhu2', label:'Còn bạn: một "giá như" mà bạn quyết không để xảy ra với mình ở Nhật là gì?', ph:'Ví dụ: Mình sẽ không bao giờ phải nói "giá như mình đã từ chối ván bài đầu tiên".'}}
]},
a73:{ai:7, t:'Lão Đỏ Đen', d:'Lô đề, vay nóng và chuyện chơi game', mins:7, steps:[
  {k:'branch', title:'Lô đề trong nhóm đồng hương', foe:'ngu',
    ctx:'Nhóm chat đồng hương mở "lô đề online". Ai cũng đánh, hôm qua có người trúng 20 man.',
    from:'Nhóm "Anh Em Xa Xứ"', sub:'Nhóm chat 40 người',
    msgs:['Đánh nhỏ cho vui thôi, 1 man có khi về 20 man.','Chuyển khoản cho admin là xong, kín lắm.'],
    flags:['"Đánh nhỏ cho vui" là cách mọi con nợ bắt đầu','Chuyển tiền cho người lạ, không ai bảo đảm','Đánh bạc ăn tiền là phạm luật ở Nhật'],
    opts:[
      {t:'Không tham gia, rời nhóm và báo người hướng dẫn.', ok:1, out:{t:'Lão Đỏ Đen mất một con mồi', p:'Bạn rời nhóm. Vài tháng sau nghe tin admin nhóm bị bắt, nhiều người trong nhóm bị gọi lên làm việc.'}},
      {t:'Đánh thử 1 man, thua thì thôi.', ok:0, out:{t:'"Thua thì thôi" không bao giờ dừng ở 1 man', p:'Năm 2026, một bạn Kỹ năng đặc định mê lô đề, vướng vào tổ chức cờ bạc, phải vay tiền, kể cả dùng giấy tờ cá nhân để vay. Bạn bị cho về nước, gia đình phải gửi một số tiền lớn để giải quyết và lấy lại giấy tờ.', r:4}},
      {t:'Nhờ người khác đánh hộ để mình không đứng tên.', ok:0, out:{t:'Không đứng tên vẫn là đánh bạc', p:'Tiền là của bạn, người hưởng lợi là bạn. Nhờ đánh hộ chỉ kéo thêm một người nữa vào vòng nguy hiểm.', r:3}}
    ],
    law:{t:'Cờ bạc ăn tiền: phát hiện là về nước.', p:[
      'Đánh bạc ăn tiền, kể cả lô đề, cá độ online, là phạm luật ở Nhật. Tổ chức đánh bạc còn bị xử nặng hơn.',
      'Theo anh chị Koka: TTS chơi cờ bạc lô đề, khi bị phát hiện thì gần như chắc chắn bị cho về nước.',
      'Nợ cờ bạc kéo theo vay nóng, cầm cố giấy tờ, rồi đến lời rủ bán tài khoản.'],
      src:'Casestudy TTS Esuhai 2026, mục "Vấn đề TTS liên quan đến cờ bạc lô đề" · Bộ luật Hình sự Nhật Bản (tội đánh bạc)'},
    fix:'Lỡ đánh rồi: dừng ngay, không đánh "gỡ". Nếu đã nợ hoặc bị đòi tiền, kể ngay với Hiệp hội hoặc Esuhai trước khi nợ lớn thêm.'},
  {k:'calc'},
  {k:'check'}
]},

/* ===== TÂY TRÚC ===== */
f1:{ai:8, t:'Trước ngày về', d:'Về nước sạch sẽ để cửa quay lại luôn mở', mins:4, steps:[
  {k:'swipe', labels:{trap:'Không nên', safe:'Nên'}, intro:'Còn một tháng nữa là về nước. Việc nào nên làm, việc nào không?',
    cards:[
      {t:'Ra ngân hàng làm thủ tục đóng tài khoản.', a:'safe', why:'Tài khoản đã đóng thì không ai lợi dụng tên bạn được.'},
      {t:'Bán lại điện thoại kèm SIM đứng tên mình cho đồng hương.', a:'trap', why:'Nhượng điện thoại, SIM đứng tên mình là vi phạm luật. Hãy báo nhà mạng hủy hợp đồng.'},
      {t:'Trả hết nợ thẻ tín dụng, tiền mua trả góp trước khi bay.', a:'safe', why:'Có TTS về nước còn nợ thẻ 12 man và cố tình không trả. Nợ xấu có thể ảnh hưởng nghiêm trọng đến cơ hội quay lại Nhật.'},
      {t:'Để lại hóa đơn điện, nước chưa trả vì đằng nào cũng về.', a:'trap', why:'Thanh toán đủ mọi khoản trước khi về. Để lại nợ là để lại tiếng xấu cho Kohai và chính mình.'},
      {t:'Dọn sạch phòng KTX, vứt rác đúng ngày.', a:'safe', why:'Phí dọn dẹp, vứt rác khi về nước TTS tự chịu. Phòng sạch là món quà cho Kohai.'},
      {t:'Nộp lại thẻ cư trú tại sân bay khi rời Nhật hẳn.', a:'safe', why:'Khi rời Nhật mà không quay lại, thẻ cư trú được nộp lại tại cửa khẩu.'},
      {t:'Làm thủ tục nhận lại tiền hưu trí (Nenkin) trong 2 năm sau khi rời Nhật.', a:'safe', why:'Đây là quyền lợi của bạn: nhận lại một phần tiền hưu trí đã đóng.'},
      {t:'Muốn về sớm thì tự đặt vé bay, không cần báo ai.', a:'trap', why:'Đã có TTS nhận lương tháng đầu rồi tự đặt vé bỏ về, khiến công ty và các bên rất khó xử. Muốn dừng chương trình, hãy nói thẳng với công ty và Esuhai.'}
    ], src:SRC_SOTAY+', mục 9(2) · '+SRC_BG+', slide 28 và 50 · Tikme, chuyên mục "Quy định & Bảo hiểm" · Casestudy TTS Esuhai 2025, 2026'},
  {k:'say', who:'tan', mood:'', text:'Về nước sạch sẽ không chỉ là xong một chương trình. Đó là để cánh cửa quay lại Nhật luôn mở cho cháu: Kỹ năng đặc định, Kỹ sư, hay đơn giản là một chuyến du lịch thăm lại công ty cũ.'}
]},
f2:{ai:8, t:'Túi cứu viện', d:'Một tấm thẻ mang theo suốt những năm ở Nhật', mins:4, steps:[
  {k:'sos'}
]},
f3:{ai:8, t:'Vô tự chân kinh', d:'Trang kinh cuối cùng do bạn tự viết', mins:5, steps:[
  {k:'say', who:'hau', mood:'think', text:'Trong Tây du ký, lần đầu thầy trò nhận kinh, mở ra thì toàn trang giấy trắng. Phật Tổ nói: kinh không chữ cũng là chân kinh. [Tên] đã có bảy trang kinh viết bằng luật. Trang cuối cùng không có chữ, vì nó phải do chính bạn viết.'},
  {k:'write', intro:'Viết trang kinh của bạn. Trang này sẽ in trên vé hoàn thành.',
    fields:[{key:'kinh', label:'Ba điều tôi hứa giữ suốt những năm ở Nhật là…', ph:'Ví dụ: Không bao giờ cho mượn thẻ, tài khoản, điện thoại. Nghi ngờ thì hỏi người hướng dẫn trước. Đi đến nơi, về đến chốn để bố mẹ yên lòng.', req:1, min:10}],
    opt:{key:'tang', label:'Ngày về, bạn muốn mang thành quả về tặng ai, và vì sao?', ph:'Ví dụ: Tặng mẹ, vì mẹ đã vay tiền cho mình đi học và chưa từng than một câu.'}}
]},

/* ===== ẢI 6 · HANG HỒ LY ===== */
w6:{ai:6, warm:1, t:'Khởi động 30 giây', d:'Đúng hay sai? Ba câu nhanh', mins:1, steps:[
  {k:'tf', items:[
    {t:'Kẻ lừa đảo thường là người lạ, mình không quen.', a:false, why:'Nhiều vụ của anh chị TTS bắt đầu từ người quen: bạn học cũ, đồng hương, người yêu qua mạng.'},
    {t:'Nhật Bản an toàn nên không cần cảnh giác như ở Việt Nam.', a:false, why:'Kẻ xấu nhắm vào người mới sang, chưa rành tiếng và luật. An toàn là khi mình biết tự bảo vệ.'},
    {t:'Lời mời càng gấp, càng dặn giữ bí mật thì càng đáng ngờ.', a:true, why:'Gấp để bạn không kịp hỏi ai. Bí mật để không ai kịp can.'}
  ]}
]},
a61:{ai:6, t:'Ba lần biến hình', d:'Hồ Ly đội 3 lốt. Bạn chọn đường nào?', mins:7, steps:[
  {k:'say', who:'hau', mood:'think', text:'Trong truyện, Bạch Cốt Tinh hóa thành ba người khác nhau để lừa thầy Đường Tăng. Hồ Ly cũng vậy. Mỗi ngã rẽ, [Tên] chọn một lối. Chọn sai cũng không sao: bạn sẽ thấy chuyện gì xảy ra, rồi quay lại chọn tiếp.'},
  {k:'branch', title:'Lốt 1 · Người đồng hương tốt bụng',
    ctx:'Còn 2 tuần nữa là bạn hết hạn và về nước. Anh Hải quen qua nhóm Facebook đồng hương, từng chở bạn đi mua đồ, nhắn tin:',
    from:'Anh Hải', sub:'Đồng hương · quen 8 tháng',
    msgs:['Em sắp về rồi hả?','Tài khoản ngân hàng với cái điện thoại, em để lại cho anh nhé. Anh trả 3 man.','Đằng nào em về cũng bỏ. Để lại vừa có tiền, vừa giúp anh.'],
    flags:['Trả tiền cao cho thứ "đằng nào cũng bỏ"','Thứ anh ấy cần là tài khoản và số điện thoại đứng tên bạn','Dùng tình cảm để ép: "giúp anh"'],
    opts:[
      {t:'Đồng ý. Sắp về rồi, có thêm 3 man mua quà cho bố mẹ cũng tốt.', ok:0, out:{t:'4 tháng sau…', p:'Bạn về Việt Nam với 3 man. Tài khoản đứng tên bạn bị dùng để nhận tiền của một vụ lừa đảo. Cảnh sát Nhật lần theo tên chủ tài khoản. Khi bạn muốn quay lại Nhật làm việc, hồ sơ gặp khó.', r:3}},
      {t:'Hỏi anh ấy dùng vào việc gì. Nếu nghe hợp lý thì để lại cho anh.', ok:0, out:{t:'Lý do nào nghe cũng hợp lý', p:'"Anh cần tài khoản để nhận tiền làm thêm thôi." Bạn tin và đưa. Nhưng vấn đề không nằm ở lý do: cho người khác dùng tài khoản đứng tên mình đã là phạm luật, dù họ dùng vào việc gì.', r:3}},
      {t:'Từ chối. Trước khi về, đóng tài khoản và hủy hợp đồng điện thoại.', ok:1, out:{t:'Bạn về nước nhẹ nhàng', p:'Tài khoản đã đóng, hợp đồng điện thoại đã hủy. Không ai dùng được tên bạn ở Nhật nữa. Cánh cửa quay lại Nhật vẫn rộng mở.'}}
    ],
    law:{t:'Tài khoản, thẻ ngân hàng và điện thoại đứng tên bạn chỉ dành cho bạn.', p:[
      'Bán, cho thuê, cho mượn tài khoản hay thẻ rút tiền là vi phạm Luật phòng chống chuyển giao tiền do phạm tội.',
      'Nhượng điện thoại, SIM đứng tên mình cho người khác là vi phạm Luật phòng chống sử dụng trái phép điện thoại di động.',
      'Sắp về nước? Đóng tài khoản ngân hàng và hủy hợp đồng điện thoại trước khi đi.',
      'Năm 2026, hai TTS năm thứ hai phải về nước vì cho mượn tài khoản, thế chấp hộ chiếu, dù cảnh sát chưa vào cuộc. Ngay lúc cho mượn đã là sai.'],
      src:SRC_SOTAY+', mục 9(2) · Sổ tay hướng dẫn cư trú và lao động 2024, chương 12 · Casestudy TTS Esuhai 2026'},
    fix:'Báo ngay ngân hàng để khóa tài khoản, báo Hiệp hội hoặc Esuhai, rồi đến đồn cảnh sát trình báo. Báo càng sớm, càng dễ chứng minh bạn là người bị lợi dụng.'},
  {k:'branch', title:'Lốt 2 · Người yêu qua mạng',
    ctx:'Bạn quen Linh qua một ứng dụng hẹn hò được hơn 1 tháng. Hai người nói chuyện mỗi tối, rất hợp nhau. Một hôm Linh nhắn:',
    from:'Linh', sub:'Quen qua ứng dụng hẹn hò',
    msgs:['[Tên] ơi, tớ đặt ít đồ online mà nhà tớ hay vắng.','Cho tớ gửi về địa chỉ KTX của cậu nhé. Cậu nhận rồi gửi tiếp giúp tớ.','Tớ gửi cậu 5.000 yên tiền công nha ❤️'],
    flags:['Chưa gặp ngoài đời đã nhờ việc liên quan đến hàng hóa, địa chỉ','Trả tiền công cho một việc quá dễ','Hàng không gửi thẳng cho người đặt mà phải qua tay bạn'],
    opts:[
      {t:'Từ chối nhẹ nhàng, rồi kể chuyện với người hướng dẫn hoặc Esuhai.', ok:1, out:{t:'Hồ Ly lộ mặt', p:'Bị từ chối, Linh giận dỗi rồi biến mất. Người hướng dẫn kể cho bạn: chiêu "yêu qua mạng, nhờ nhận hàng" này nhiều anh chị TTS đã gặp.'}},
      {t:'Nhận giúp. Người yêu nhờ mà, lại còn có tiền công nữa.', ok:0, out:{t:'2 tuần sau…', p:'Thùng hàng là đồ mua bằng thẻ tín dụng bị đánh cắp. Cảnh sát đến KTX vì địa chỉ nhận hàng là của bạn. Bạn bị đưa về đồn làm rõ, công ty phải đến bảo lãnh. Còn Linh thì xóa tài khoản.', r:3}},
      {t:'Nhận giúp lần này thôi, và không lấy tiền công cho đỡ ngại.', ok:0, out:{t:'Một lần là đủ', p:'Không lấy tiền công vẫn là nhận và chuyển hàng giúp một người bạn chưa từng gặp. Chỉ một lần, địa chỉ KTX và tên bạn đã nằm trong hồ sơ vụ việc.', r:3}}
    ],
    law:{t:'Nhận hàng hộ người lạ có thể biến bạn thành đồng phạm.', p:[
      'Giả làm người khác để ký nhận bưu kiện là làm giả chữ ký.',
      'Nhận rồi chuyển tiếp hàng lừa được của người khác có thể bị xem là đồng lõa lừa đảo.',
      'Nói "em không biết bên trong có gì" không giúp bạn thoát trách nhiệm.'],
      src:SRC_SOTAY+', mục 9(2) · '+SRC_BG+', slide 20'},
    fix:'Đừng mở, đừng gửi tiếp. Giữ nguyên tin nhắn và gói hàng, báo ngay công ty hoặc Hiệp hội. Có thể gọi đường dây tư vấn của cảnh sát #9110 (khi chưa khẩn cấp).'},
  {k:'branch', title:'Lốt 3 · Anh làm dịch vụ',
    ctx:'Bạn đang ở năm thứ nhất, lương chưa nhiều. Trong nhóm Facebook người Việt ở tỉnh, tài khoản "Việc Thơm" nhắn riêng:',
    from:'Việc Thơm', sub:'Nhắn từ nhóm Facebook',
    msgs:['Cuối tuần rảnh không em? Chạy xe đạp giao hàng quanh ga thôi.','3 man một ngày, trả tiền mặt cuối buổi.','Không cần thẻ cư trú. Nhớ đừng nói với công ty nha.'],
    flags:['Tiền nhiều bất thường cho việc rất nhẹ','Không cần giấy tờ, trả tiền mặt: không có gì để chứng minh','Dặn giấu công ty'],
    opts:[
      {t:'Đi thử một buổi cuối tuần cho biết, không ai biết đâu.', ok:0, out:{t:'Buổi đầu tiên…', p:'Bạn được giao chở mấy thùng hàng. Cảnh sát dừng xe kiểm tra: hàng không rõ nguồn gốc, bạn không giải thích được. Bạn vừa làm việc ngoài tư cách lưu trú, vừa có thể bị xem là đồng phạm.', r:4}},
      {t:'Từ chối, chụp màn hình gửi người hướng dẫn hoặc Esuhai.', ok:1, out:{t:'Một tin nhắn giúp cả nhóm', p:'Người hướng dẫn cảm ơn bạn và nhắc cả nhóm TTS trong công ty. Không ai trong nhóm bị kéo vào.'}},
      {t:'Nhận, nhưng chỉ làm ngày nghỉ để không ảnh hưởng công ty.', ok:0, out:{t:'Ngày nghỉ cũng không được', p:'Thẻ cư trú của bạn ghi rõ: không được làm việc ngoài hoạt động đã đăng ký. Ngày làm hay ngày nghỉ đều như nhau. Bật kiếm tiền TikTok hay bán hàng online cũng bị tính là thu nhập ngoài.', r:2}}
    ],
    law:{t:'Thẻ cư trú cho phép bạn làm việc ở đúng một nơi: nơi đã đăng ký.', p:[
      'Làm thêm ở nơi khác là làm việc ngoài tư cách lưu trú: có thể bị phạt tù đến 1 năm hoặc phạt tiền đến 2 triệu yên.',
      'Bỏ nơi làm việc rồi ở lại quá hạn là cư trú bất hợp pháp: có thể bị phạt tù đến 3 năm hoặc phạt tiền đến 3 triệu yên, rồi bị trục xuất.',
      'Quy định này áp dụng cho cả Thực tập sinh và Ikusei Shuro.'],
      src:'Luật Quản lý xuất nhập cảnh Nhật Bản, theo '+SRC_SOTAY+', mục 6 và 9 · '+SRC_BG+', slide 22–23 và 35'},
    fix:'Lỡ nhận lời rồi thì dừng ngay, chưa đi buổi nào càng tốt. Kể thật với người hướng dẫn hoặc Esuhai. Nói thật sớm giúp mọi người kịp bảo vệ bạn.'},
  {k:'say', who:'hau', mood:'cheer', text:'Bạn để ý không? Cả ba lần, Hồ Ly đều không bảo bạn làm việc xấu. Nó chỉ nhờ "giúp một chút" bằng thứ đứng tên bạn: tài khoản, địa chỉ, sức lao động. Nhớ mẹo này là [Tên] nhìn thấu được nhiều lốt khác nữa!'}
]},
a62:{ai:6, t:'Hỏa nhãn kim tinh', d:'Soi một bài đăng tuyển người, phân biệt bẫy và việc an toàn', mins:5, steps:[
  {k:'flags', intro:'Bài đăng này xuất hiện trong một nhóm Facebook người Việt ở Nhật. Có 5 dấu hiệu bẫy. Chạm vào từng câu đáng ngờ.',
    from:'Hội Việc Làm Người Việt Kansai', sub:'Bài đăng trong nhóm · 2 giờ trước',
    segs:[
      {t:'TUYỂN GẤP', f:1, why:'Ép bạn quyết nhanh, không kịp hỏi ai.'},
      {t:' 5 bạn làm nhà máy thực phẩm ở Osaka.'},
      {t:' Lương 35 man/tháng, việc nhẹ.', f:1, why:'Gần gấp đôi lương thường mà lại "nhẹ". Việc nhẹ lương cao gần như luôn là bẫy.'},
      {t:' Có phòng ở gần ga.'},
      {t:' Không cần thẻ cư trú, không cần hộ chiếu.', f:1, why:'Nơi làm việc hợp pháp luôn phải kiểm tra giấy tờ. Không cần giấy tờ nghĩa là làm chui.'},
      {t:' TTS đang làm ở công ty cũ vẫn nhận.', f:1, why:'Mời TTS bỏ công ty đang làm, tức là rủ bỏ trốn.'},
      {t:' Làm từ thứ Hai đến thứ Sáu.'},
      {t:' Xe đón tận nơi trong đêm, nhắn riêng, không nói với ai.', f:1, why:'Lén lút, giữ bí mật: dấu hiệu của đường dây môi giới bất hợp pháp.'}
    ],
    law:{t:'Đây là lời rủ bỏ trốn, dù không dùng chữ "bỏ trốn".', p:[
      'Bỏ nơi thực tập để làm chỗ khác là vi phạm luật cư trú, sẽ bị cưỡng chế trục xuất.',
      'Chỗ "lương cao" thường không hợp đồng, không bảo hiểm, công việc nguy hiểm.'],
      src:SRC_SOTAY+', mục 6 · Casestudy TTS Esuhai, mục "Các chiêu lừa đảo có thể có tại Nhật"'}},
  {k:'swipe', intro:'Mỗi thẻ là một việc. Chọn "Bẫy" hoặc "An toàn". Trên điện thoại, bạn có thể quẹt trái (bẫy) hoặc phải (an toàn).',
    cards:[
      {t:'Gửi tiền về nhà qua công ty chuyển tiền có giấy phép (như DCOM, SBI Remit), có hóa đơn.', a:'safe', why:'Ở Nhật, chỉ ngân hàng và công ty chuyển tiền được cấp phép mới được nhận chuyển tiền ra nước ngoài. Phí cao hơn chút nhưng được pháp luật bảo vệ.'},
      {t:'Đưa tiền mặt cho người quen chuyển về Việt Nam giúp, tỷ giá cao hơn ngân hàng.', a:'trap', why:'Đây là chuyển tiền tay ba qua dịch vụ không phép. Tiền mất thì không đòi được, bạn còn có thể dính vào đường dây rửa tiền.'},
      {t:'Bật chế độ kiếm tiền trên TikTok, Facebook để có thêm thu nhập.', a:'trap', why:'Đó là thu nhập ngoài công việc đã đăng ký. Đã có bạn TTS phải về nước vì việc này.'},
      {t:'Mua iPhone giá chỉ một nửa trên Facebook, người bán yêu cầu chuyển khoản trước.', a:'trap', why:'Chiêu bán hàng qua mạng: nhận tiền rồi biến mất. Tài khoản nhận tiền thường là tài khoản mua lại của người đã về nước.'},
      {t:'Trước ngày về nước, ra ngân hàng làm thủ tục đóng tài khoản.', a:'safe', why:'Đúng như Sổ tay TTS của OTIT hướng dẫn. Tài khoản đã đóng thì không ai lợi dụng được.'},
      {t:'Chia sẻ ngay bài "động đất lớn, sắp có sóng thần" từ một trang lạ trên Facebook.', a:'trap', why:'Năm 2026 từng có tin động đất giật tít, dùng ảnh cũ để câu like. Tin quan trọng hãy kiểm tra với Hiệp hội hoặc trang chính thức trước khi tin và chia sẻ.'},
      {t:'Cho bạn cùng phòng mượn thẻ cư trú để đi làm hợp đồng điện thoại.', a:'trap', why:'Thẻ cư trú phải luôn mang theo người, không cho mượn, không gửi ai giữ hộ. Thẻ có thể bị dùng làm giấy tờ giả.'}
    ], src:SRC_BG+', slide 13, 15, 22 · '+SRC_SOTAY+', mục 9(2) và 10'}
]},
a63:{ai:6, t:'Bùa hộ thân', d:'Biết gọi ai khi Hồ Ly tìm đến', mins:4, steps:[
  {k:'channels'},
  {k:'sits', intro:'Mỗi tình huống, chọn những người bạn sẽ liên hệ rồi bấm "Kiểm tra".',
    chips:['Người hướng dẫn ở công ty','Hiệp hội','Esuhai tại Nhật','OTIT 0120-250-168','Cảnh sát 110','Cảnh sát tư vấn #9110','Hỏi nhóm Facebook đồng hương','Im lặng, tự xử lý'],
    sits:[
      {t:'Một người lạ nhắn tin, trả 3 man để mua tài khoản ngân hàng của bạn.', good:[0,1,2], ok:[3,5], bad:[4,6,7], must:[],
        why:'Báo người hướng dẫn, Hiệp hội hoặc Esuhai để họ cảnh báo cả nhóm. Chưa có nguy hiểm trước mắt nên chưa cần gọi 110.'},
      {t:'Bạn lỡ nhận giúp một thùng hàng lạ. Người gửi đang giục bạn gửi tiếp.', good:[0,1,2,5], ok:[3], bad:[6,7], must:[],
        why:'Đừng mở, đừng gửi tiếp. Báo công ty hoặc Hiệp hội ngay, có thể gọi #9110 để cảnh sát tư vấn.'},
      {t:'Một nhóm người đến KTX đòi nợ thay bạn cùng phòng và dọa đánh.', good:[4,0,1,2], ok:[3,5], bad:[6,7], must:[4],
        why:'Bị đe dọa là khẩn cấp: gọi 110 trước. Sau đó báo công ty, Hiệp hội hoặc Esuhai.'}
    ]},
  {k:'write', intro:'Viết lá bùa cho chính mình. Một câu ngắn là đủ, viết thật để nhớ lâu.',
    fields:[{key:'bua', label:'Khi có người nhờ mình "giúp một chút" bằng tài khoản, địa chỉ hay giấy tờ của mình, thì tôi sẽ…', ph:'Ví dụ: …từ chối ngay và nhắn cho người hướng dẫn ở công ty.', req:1, min:4}],
    opt:{key:'tuchoi', label:'Nếu người rủ là bạn thân, bạn sẽ nói gì để từ chối mà vẫn giữ tình bạn?', ph:'Ví dụ: Tớ quý cậu, nhưng thứ gì đứng tên tớ thì tớ không đưa ai được. Mình cùng hỏi chị Hiệp hội nhé.'}}
]}
};

/* =========================================================
   PHẦN 2b · HỎI NHANH CHÚ TANAKA (trình bày theo kiểu sổ tay hỏi–đáp)
   ========================================================= */
var QA_CH = [
  {k:'the', t:'Thẻ cư trú và giấy tờ', ic:'card'},

/* =========================================================
   PHẦN 3 · DỮ LIỆU HỌC VIÊN (lưu trong trình duyệt)
   ========================================================= */
var KEY = 'tk-hp04';
try{ if(localStorage.getItem('tk-hp04-mode')==='demo') KEY='tk-hp04-demo'; }catch(e){}
var APP = document.getElementById('app');
function blank(){ return {v:1, name:'', by:'', cls:'', path:'', gate:0, onb:0, created:Date.now(), d:{}, done:{}, xp:{}, ins:{}, days:{}, seals:{}, ver:VERSION, savedAt:0}; }
function load(){
  try{ var s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s && typeof s==='object') return normalize(s); }catch(e){}
  return blank();
}
function normalize(s){ var b=blank(); for(var k in b){ if(s[k]===undefined) s[k]=b[k]; } s.ver=VERSION; return s; }
var S = load();
var saveT=null, NOSAVE=0;
function save(now){
  clearTimeout(saveT); if(NOSAVE) return;
  var w=function(){ try{ S.savedAt=Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
  if(now) w(); else saveT=setTimeout(w, 250);
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') save(true); });
window.addEventListener('pagehide', function(){ save(true); });

/* ---------- tiện ích ---------- */
function $(q,r){ return (r||document).querySelector(q); }
function $$(q,r){ return Array.prototype.slice.call((r||document).querySelectorAll(q)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function given(){ var n=String(S.name||'').trim().split(/\s+/); return n[n.length-1]||'bạn'; }
function T(s){ return esc(s).replace(/\[Tên\]/g, esc(given())); }
function pad(n){ return (n<10?'0':'')+n; }
function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dkey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDate(t){ var d=new Date(t||Date.now()); return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(); }
function fmtTime(t){ var d=new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function words(s){ s=String(s||'').trim(); return s ? s.split(/\s+/).length : 0; }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]/g,''); }
function noMotion(){ return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }
function aiOf(n){ return n===0 ? START : (n===8 ? FINAL : AIS[n-1]); }

/* ---------- điểm thưởng ---------- */
function xpTotal(){ var t=0; for(var k in S.xp) t+=S.xp[k]; return t; }
function insTotal(){ var t=0; for(var k in S.ins) t+=S.ins[k]; return t; }
function doneCount(){ return Object.keys(S.done).length; }
function addXP(key,n,silent){ if(S.xp[key]!=null) return 0; S.xp[key]=n; S.d.nbDot=1; save(); if(!silent) pointToast(n,0); updateNav(); return n; }
function setIns(key,n){ var old=S.ins[key]||0; if(n<=old) return 0; S.ins[key]=n; S.d.nbDot=1; save(); updateNav(); return n-old; }
function streak(){
  var d=new Date(), n=0;
  if(!S.days[dkey(d)]) d.setDate(d.getDate()-1);
  while(S.days[dkey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
/* thời gian học: chỉ đếm khi màn hình mở và có thao tác trong 60 giây gần nhất */
var lastAct=Date.now();
['pointerdown','keydown','scroll','touchstart'].forEach(function(ev){ window.addEventListener(ev,function(){ lastAct=Date.now(); },{passive:true}); });
setInterval(function(){
  if(document.visibilityState!=='visible' || Date.now()-lastAct>60000 || !S.gate) return;
  var k=today(); S.days[k]=Math.round(((S.days[k]||0)+0.25)*100)/100; save();
},15000);
function markDay(){ var k=today(); if(!S.days[k]) { S.days[k]=0.25; save(); } }

/* ---------- trạng thái mở khóa ---------- */
function actDone(id){ return !!S.done[id]; }
function startDone(){ return START.acts.every(actDone); }
function aiDone(n){ var a=aiOf(n); return !!(a.acts && a.acts.every(actDone)); }
function sealed(n){ return aiDone(n) && !!S.seals[n]; }
function aiOpen(n){
  if(n===0) return true;
  if(!BUILT[n] || !startDone()) return false;
  if(n===1) return true;
  if(n===8) return AIS.every(function(a){ return sealed(a.n); });
  return sealed(n-1);                 /* các ải khác: qua ải trước mới mở */
}
function actOpen(id){
  var a=ACTS[id], ai=aiOf(a.ai);
  if(a.warm) return aiOpen(a.ai);
  var i=ai.acts.indexOf(id);
  return aiOpen(a.ai) && (i===0 || actDone(ai.acts[i-1]));
}
function nextTarget(){
  if(!startDone()) { var id=START.acts.filter(function(x){return !actDone(x);})[0]; return {label:'Bắt đầu: Lên đường', act:'ai', n:0}; }
  var LIST=AIS.concat([FINAL]); for(var i=0;i<LIST.length;i++){ var a=LIST[i]; if(BUILT[a.n] && aiOpen(a.n) && !sealed(a.n)) return {label:(anyDone(a.n)?'Đi tiếp: ':'Vào ')+a.vn, act:'ai', n:a.n}; }
  return null;
}
function anyDone(n){ var a=aiOf(n); return a.acts && a.acts.some(actDone); }

/* ---------- điều hướng ---------- */
var V = {v:'home'};
function go(v, opt){
  var nv={v:v}; for(var k in (opt||{})) nv[k]=opt[k];
  V=nv;
  try{ history.pushState(V,'', ''); }catch(e){}
  render(true);
}
window.addEventListener('popstate', function(e){
  if(nbOpen){ closeNb(true); return; }
  if(askOpen){ closeAsk(true); return; }
  V = (e.state && e.state.v) ? e.state : {v:'home'};
  render(true);
});

/* ---------- thông báo ---------- */
var toastT=null;
function toast(html, ms){
  var t=$('#toast'); t.innerHTML=html; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(hideToast, ms||4000);
}
function hideToast(){ $('#toast').classList.remove('show'); }
window.addEventListener('scroll', function(){ if($('#toast').classList.contains('show') && Date.now()-toastShownAt>800) hideToast(); }, {passive:true});
var toastShownAt=0;
function pointToast(xp, ins, msg){
  var h=(msg?esc(msg)+' ':'')+(xp?'<span class="pt xp">+'+xp+' XP</span>':'')+(ins?'<span class="pt ins">+'+ins+' Insight</span>':'');
  toastShownAt=Date.now(); toast(h, 4000);
}

/* ---------- thanh điều hướng nổi ---------- */
function updateNav(){
  $('#navMap').innerHTML=icon('map',22);
  $('#navAsk').innerHTML=icon('ask',22);
  $('#navNb').innerHTML=icon('book',22)+(S.d.nbDot?'<span class="dot" aria-label="Có điểm mới"></span>':'');

function stOf(id){ var k='st.'+id; if(!S.d[k]) S.d[k]={i:0,max:0}; return S.d[k]; }

    '<div class="stepbox" id="stepbox"></div>'+
    '<div class="sbar" id="sbar"></div>'+
    (st.i>0?'<div style="text-align:center;margin-top:10px"><button class="btn btn--link" data-act="prevStep">Xem lại bước trước</button></div>':'')+
    foot()+'</div>';
}
var CUR=null;   /* {id, i, kind} */
function wireAct(){
  var a=ACTS[V.id]; if(!a) return;
  var st=stOf(V.id);
  CUR={id:V.id, i:st.i, s:a.steps[st.i]};
  drawStep();
  if(!S.d.tip1){ S.d.tip1=1; save(); setTimeout(function(){ toast('Mẹo: chạm vào dòng trạng thái ở cuối trang để đến ngay phần còn thiếu.', 6000); }, 900); }
}
function drawStep(){
  var r=STEP[CUR.s.k].view(CUR.s, xs(CUR.id,CUR.i));
  $('#stepbox').innerHTML=r;
  if(STEP[CUR.s.k].wire) STEP[CUR.s.k].wire(CUR.s, xs(CUR.id,CUR.i));
  drawBar();
}
function drawBar(){
  var a=ACTS[CUR.id], last=CUR.i===a.steps.length-1, x=xs(CUR.id,CUR.i);
  var r=STEP[CUR.s.k].state(CUR.s, x);
  var lbl = last ? 'Hoàn thành' : 'Tiếp tục';
  $('#sbar').innerHTML='<button class="sbar__s '+(r.ok?'ready':'need')+'" data-act="need" data-q="'+esc(r.q||'')+'">'+(r.ok?(last?'Sẵn sàng hoàn thành':'Sẵn sàng'):esc(r.msg||'Chưa xong'))+'</button>'+
    '<button class="btn" data-act="nextStep" '+(r.ok?'':'disabled')+'>'+lbl+'</button>';
}
function nextStep(){
  var a=ACTS[CUR.id], st=stOf(CUR.id);
  var r=STEP[CUR.s.k].state(CUR.s, xs(CUR.id,CUR.i)); if(!r.ok) return;
  addXP('step.'+CUR.id+'.'+CUR.i, CUR.s.k==='say'?2:5, true);
  if(CUR.i < a.steps.length-1){
    st.i++; st.max=Math.max(st.max,st.i); save();
    V.scroll=0; render(true);
  } else finishAct();
}
function prevStep(){ var st=stOf(CUR.id); if(st.i>0){ st.i--; save(); V.scroll=0; render(true); } }
function finishAct(){
  var id=CUR.id, a=ACTS[id], first=!S.done[id];
  if(first){ S.done[id]=Date.now(); }
  var gx=addXP('done.'+id, a.warm?10:20, true);
  save(true);
  stampFx(a.warm?'早':'済');
  var ai=aiOf(a.ai);
  var msg = a.warm ? 'Khởi động xong!' : 'Xong chặng!';
  setTimeout(function(){
    go('ai',{n:a.ai});

function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function wrapText(g,t,x,y,mw,lh){ var w=String(t).split(' '), line=''; for(var i=0;i<w.length;i++){ var tt=line+w[i]+' '; if(g.measureText(tt).width>mw && line){ g.fillText(line,x,y); line=w[i]+' '; y+=lh; } else line=tt; } g.fillText(line,x,y); return y; }

function isDemoInput(n,c){ return norm(n)===norm(DEMO_NAME) && norm(c)===norm(DEMO_CLS); }
function solveStep(id,i,s){
  var x={};
  switch(s.k){
    case 'cast': x={cur:4,max:4}; break;
    case 'classify': x.a={}; s.items.forEach(function(it,k){ x.a[k]={ok:1,bad:[]}; }); break;
    case 'tf': x.a={}; s.items.forEach(function(it,k){ x.a[k]=it.a; }); break;
    case 'branch': var r=s.opts.findIndex(function(o){ return o.ok; }); x={pick:r,solved:1,tried:(i%2?[ (r+1)%3 ]:[]),fixSeen:1}; break;
    case 'flags': x.f=[]; s.segs.forEach(function(g,k){ if(g.f) x.f.push(k); }); x.c=[]; break;
    case 'swipe': x={q:[],ok:s.cards.map(function(c,k){ return k; }),shown:null}; break;
    case 'sits': x.r={}; s.sits.forEach(function(st,k){ x.r[k]={sel:st.must.length?st.must.slice():[st.good[0]],ok:1}; }); break;
    case 'order': x={mix:s.items.map(function(t,k){ return k; }).reverse(),seq:s.items.map(function(t,k){ return k; })}; break;
    case 'rcard': x.seen=RC_FIELDS.map(function(f){ return f.k; }); break;
    case 'explore': x.seen=s.items.filter(function(it){ return !it.sub; }).map(function(it){ return it.k; }); break;
    case 'street': x={done:{},bad:{},cur:s.spots[s.spots.length-1].k}; s.spots.forEach(function(p){ x.done[p.k]=1; }); break;
    case 'tikme': x.a={}; s.qs.forEach(function(q,k){ x.a[k]={ok:1,bad:[]}; }); S.d.tik=S.d.tik||{}; S.d.tik[s.url]={o:Date.now()-86400000}; break;
    case 'video': x={seg:s.segs.length-1,w:{},a:{}}; s.segs.forEach(function(g,k){ x.w[k]=1; x.a[k]={ok:1,bad:k===1?[1]:[]}; }); break;
    case 'calc': x={m:6,slid:1,q:{ok:1,bad:[]}}; break;
    case 'check': x={c:[0],seen:1,luat:'Chỉ chơi sau khi học xong, tắt máy trước 23 giờ, không nạp quá 1.000 yên mỗi tháng.'}; break;
    case 'sos': x={saved:1}; break;
    case 'write': s.fields.concat(s.opt?[s.opt]:[]).forEach(function(f){ x[f.key]=DEMO_TXT[f.key]||'Em sẽ hỏi người hướng dẫn trước, làm đúng quy định và báo cáo sớm khi có chuyện.'; }); break;
  }
  return x;
}

  if(e.key==='Enter' && e.target && e.target.id==='gIn'){ e.preventDefault(); gateGo(); }
  if((e.key==='Enter'||e.key===' ') && e.target && e.target.getAttribute && e.target.getAttribute('role')==='button' && e.target.hasAttribute('data-act')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('pointerdown', function(e){ if($('#toast').classList.contains('show') && !e.target.closest('#toast')) hideToast(); });

/* khởi động */
try{ history.replaceState(V,'',''); }catch(e){}
if(S.gate) markDay();
render(true);
</script>
